[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kaomojo-client"
version = "4.16.0"
description = "Collect kaomoji sightings from supported local coding-agent sessions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "platformdirs>=4,<5",
  "requests>=2.31,<3",
  "coding-agent-sessions @ https://agent-telemetry.aisloppy.com/downloads/coding_agent_sessions-0.13.0.tar.gz#sha256=ad39e987b398f524012e87f583ebeebf9e2c85c63d9b4964f3de4fca986a59f5",
]

[project.scripts]
kaomojo = "kaomojo_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
