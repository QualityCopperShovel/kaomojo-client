[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kaomojo-client"
version = "4.17.0"
description = "Collect kaomoji sightings from supported local coding-agent sessions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "platformdirs>=4,<5",
  "requests>=2.31,<3",
  "coding-agent-sessions @ https://agent-telemetry.aisloppy.com/downloads/coding_agent_sessions-0.15.1.tar.gz#sha256=7c81a1d11bf64490d3b56a9450654ab052c6301548f8c8671339a89fddca742a",
]

[project.scripts]
kaomojo = "kaomojo_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
