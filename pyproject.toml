[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kaomojo-client"
version = "4.1.1"
description = "Collect kaomoji sightings from local Codex and Claude Code sessions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["platformdirs>=4,<5", "requests>=2.31,<3"]

[project.scripts]
kaomojo = "kaomojo_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
